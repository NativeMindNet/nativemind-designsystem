<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Custom single-path SVGs — tab bar, power glyph, stat & flag icons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-family); }
  .row { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  img { width: 30px; height: 30px; }
  .glyph { width: 52px; height: 52px; border-radius: 50%; background: var(--brand-gradient); display: flex; align-items: center; justify-content: center; }
  .glyph img { width: 26px; height: 26px; filter: brightness(0) invert(1); }
  .cap { font-size: 11px; color: var(--fg-2); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="glyph"><img src="../assets/icons/power.svg" alt=""></div><span class="cap">power</span></div>
    <div class="item"><img src="../assets/icons/tab-home.svg" alt=""><span class="cap">home</span></div>
    <div class="item"><img src="../assets/icons/tab-server.svg" alt=""><span class="cap">server</span></div>
    <div class="item"><img src="../assets/icons/tab-app.svg" alt=""><span class="cap">apps</span></div>
    <div class="item"><img src="../assets/icons/tab-settings.svg" alt=""><span class="cap">settings</span></div>
    <div class="item"><img src="../assets/icons/icon-speed.svg" alt=""><span class="cap">speed</span></div>
    <div class="item"><img src="../assets/icons/icon-download.svg" alt=""><span class="cap">download</span></div>
    <div class="item"><img src="../assets/icons/icon-upload.svg" alt=""><span class="cap">upload</span></div>
    <div class="item"><img src="../assets/icons/flag-de.svg" alt="" style="border-radius:4px"><span class="cap">flag</span></div>
  </div>
</body>
</html>
