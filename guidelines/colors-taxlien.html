<!-- @dsCard group="Colors" viewport="700x160" name="TaxLien domain" subtitle="Property stages & X-Ray insight tints (extends the shared palette)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font-family); }
  .group { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { padding: 7px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 10px; }
</style>
</head>
<body>
  <p class="lbl">Property stages</p>
  <div class="group" style="margin-bottom:18px">
    <span class="pill" style="background:rgba(255,176,32,0.14);color:#FFB020">PRE-AUCTION</span>
    <span class="pill" style="background:rgba(0,91,234,0.12);color:#005BEA">LISTED</span>
    <span class="pill" style="background:rgba(0,198,251,0.14);color:#0094c4">OTC</span>
    <span class="pill" style="background:rgba(182,182,182,0.20);color:#7c8a93">SOLD</span>
  </div>
  <p class="lbl">X-Ray insight tints</p>
  <div class="group">
    <span class="pill" style="background:rgba(229,72,77,0.12);color:#E5484D">WARNING</span>
    <span class="pill" style="background:rgba(31,182,122,0.14);color:#1FB67A">OPPORTUNITY</span>
    <span class="pill" style="background:rgba(123,91,234,0.14);color:#7B5BEA">ETHICAL</span>
    <span class="pill" style="background:rgba(0,91,234,0.12);color:#005BEA">INFO</span>
  </div>
</body>
</html>
