<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px; background: var(--bg); }
  .display { font-family: var(--font-family); font-weight: 800; font-size: 56px; line-height: 1.0; letter-spacing: -0.02em; color: var(--fg-1); }
  .accent { background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 13px; color: var(--fg-2); margin-top: 14px; }
</style>
</head>
<body>
  <div class="display">Private. <span class="accent">Fast.</span><br>Everywhere.</div>
  <div class="sub">--t-display · 64px / 800 · tracking −0.02em</div>
</body>
</html>
