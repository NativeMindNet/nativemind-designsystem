<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="SF Pro Text — eight discrete roles, no fluid sizing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--surface); }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .spec { width: 130px; flex-shrink: 0; font-size: 12px; color: var(--fg-2); }
</style>
</head>
<body>
  <div class="row"><span class="spec">timer · 40/700</span><span class="t-timer">00:14:22</span></div>
  <div class="row"><span class="spec">title · 24/600</span><span class="t-title">Все серверы</span></div>
  <div class="row"><span class="spec">screen · 20/600</span><span class="t-screen-title">Подключение</span></div>
  <div class="row"><span class="spec">body · 17/400</span><span class="t-body">Германия — Frankfurt</span></div>
  <div class="row"><span class="spec">secondary · 15/400</span><span class="t-secondary">Ваша локация</span></div>
  <div class="row"><span class="spec">label · 14/500</span><span class="t-label">DOWNLOAD</span></div>
  <div class="row"><span class="spec">caption · 13/400</span><span class="t-caption">dev-версия · 1.0.0</span></div>
</body>
</html>
