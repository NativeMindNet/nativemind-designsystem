<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--bg); font-family: var(--font-family); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
  .switches { display: flex; flex-direction: column; gap: 16px; }
  .srow { display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
  .srow span { font-size: 15px; color: var(--fg-1); }
  .fields { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Switch, Field, Checkbox } = window.VPNclientUniversalDesignSystem_4d5632;
    const { useState } = React;
    function Demo() {
      const [a, setA] = useState(true);
      const [b, setB] = useState(false);
      const [url, setUrl] = useState("https://sub.vpnclient.app/u/9f2a");
      const [c, setC] = useState(true);
      return (
        <div className="wrap">
          <div className="switches">
            <div className="srow"><span>Kill switch</span><Switch checked={a} onChange={setA}/></div>
            <div className="srow"><span>Auto-connect</span><Switch checked={b} onChange={setB}/></div>
            <div className="srow"><span>Analytics (disabled)</span><Switch checked={false} disabled/></div>
            <div className="srow"><span>YouTube (Checkbox)</span><Checkbox state={c ? "on" : "off"} style={{cursor:"pointer"}}/></div>
            <div className="srow"><span>Amazon (Checkbox, off)</span><Checkbox state="off"/></div>
          </div>
          <div className="fields">
            <Field label="Subscription URL" value={url} onChange={setUrl}/>
            <Field label="Email" placeholder="you@example.com" error="Enter a valid email"/>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
